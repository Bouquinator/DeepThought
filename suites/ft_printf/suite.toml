# DeepThought official suite for ft_printf.
# Every test compares ft_printf with the system printf: same bytes, same return value.

[suite]
id = "ft_printf"
name = "ft_printf"
version = "1.0.0"
project = "ft_printf"
engine = ">=0.1"
authors = ["DeepThought"]
description = "cspdiuxX% conversions compared byte-for-byte with the real printf (output and return value), plus bonus flags."

[detect]
any_files = ["ft_printf.h", "*/ft_printf.h"]
makefile_name = "libftprintf.a"

[build]
command = "make -C {project}"
artifacts = ["libftprintf.a"]
checks = ["files", "rules", "relink", "norminette", "forbidden"]

[files]
required = ["Makefile", "**/ft_printf.h"]

[forbidden]
allowed = ["malloc", "free", "write"]

[defaults]
timeout = 3.0
cflags = ["-Wno-format", "-Wno-format-security"]

[[group]]
name = "Mandatory conversions"
category = "mandatory"
runner = "c-unit"
split = true
sources = ["tests/mandatory/*.c"]
include = ["{project}", "tests"]
link = ["{project}/libftprintf.a"]

[[group]]
name = "Bonus — flags, width, precision"
category = "bonus"
runner = "c-unit"
split = true
when = { make_rule = "bonus" }
before = ["make -C {project} bonus"]
sources = ["tests/bonus/*.c"]
include = ["{project}", "tests"]
link = ["{project}/libftprintf.a"]
