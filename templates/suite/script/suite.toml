# __NAME__ — a DeepThought suite using the `script` runner: any executable
# that speaks the DeepThought Test Protocol (docs/protocol.md).

[suite]
id = "__ID__"
name = "__NAME__"
version = "0.1.0"
project = "__PROJECT__"
engine = ">=0.1"
authors = ["your-login"]
description = "What this suite checks, in one sentence."

[detect]
any_files = ["Makefile"]

[build]
checks = []

[[group]]
name = "Scripted tests"
category = "mandatory"
runner = "script"
command = "run.sh"              # relative to this folder; gets --list or --run ID...
