# __NAME__ — a DeepThought test suite.
# Full reference: docs/writing-suites.md in the DeepThought repository.

[suite]
id = "__ID__"                  # unique id: letters, digits, . _ -
name = "__NAME__"
version = "0.1.0"
project = "__PROJECT__"        # the project kind this suite tests (libft, get_next_line, …)
engine = ">=0.1"
authors = ["your-login"]
description = "What this suite checks, in one sentence."

# [detect] makes the suite run automatically for every matching project folder.
# Leave it out to run the suite only on projects you link it to
# (`./dt project link PATH SUITE`, `--link PATH` when creating it, or Suites in the UI).
# [detect]
# files = ["Makefile", "main.c"]      # every file must exist
# makefile_name = "my_program"        # the Makefile's NAME must be exactly this

[build]
# Run once per test run, in an isolated copy of the project. Remove it if the
# tests compile the project's sources themselves (like get_next_line).
command = "make -C {project}"
artifacts = []                  # files the build must produce, e.g. ["libft.a"]
checks = []                     # any of: files, rules, relink, norminette, forbidden

[defaults]
timeout = 3.0                   # seconds per test

[[group]]
name = "Examples"
description = "Shown in the UI next to the group."
category = "mandatory"          # mandatory | bonus | extra
runner = "c-unit"
split = true                    # one binary per test file: a missing function only breaks its own file
sources = ["tests/*.c"]         # your test files (relative to this folder)
include = ["{project}"]         # -I directories ({project} also adds its sub-folders with headers)
link = []                       # libraries / objects to link, e.g. ["{project}/libft.a"]
