# Sstyle suite — libft
# Tests written by SStyles93 for the CodeTester (https://github.com/SStyles93/42_CodeTester),
# ported to DeepThought with the author's permission.

[suite]
id = "sstyle-libft"
name = "Sstyle suite — libft"
version = "2.0.0"
project = "libft"
engine = ">=0.2"
authors = ["SStyles93 (tests)", "DeepThought (port)"]
description = "SStyles93's libft tests: all 43 functions, one test per case, plus malloc-failure and leak checks for every allocating function."
homepage = "https://github.com/SStyles93/42_CodeTester"

[detect]
any_files = ["libft.h", "*/libft.h"]
makefile_name = "libft.a"

[build]
command = "make -C {project}"
artifacts = ["libft.a"]
checks = ["files", "rules", "relink", "norminette", "forbidden"]

[files]
required = ["Makefile", "**/libft.h"]

[forbidden]
allowed = ["malloc", "free", "write"]

[defaults]
timeout = 5.0

[[group]]
name = "Libft functions"
description = "Part 1 (libc functions) and Part 2 (additional functions)."
category = "mandatory"
runner = "c-unit"
split = true
sources = ["tests/*.c"]
include = ["{project}", "tests"]
link = ["{project}/libft.a"]

[[group]]
name = "Memory"
description = "Every allocating function: no leak, and NULL without leaking when any of its mallocs fails."
category = "mandatory"
runner = "c-unit"
split = true
sources = ["tests/memory/*.c"]
include = ["{project}", "tests", "tests/memory"]
link = ["{project}/libft.a"]

[[group]]
name = "Bonus — lists"
category = "bonus"
runner = "c-unit"
split = true
when = { make_rule = "bonus" }
before = ["make -C {project} bonus"]
sources = ["tests/bonus/*.c"]
include = ["{project}", "tests", "tests/memory"]
link = ["{project}/libft.a"]
