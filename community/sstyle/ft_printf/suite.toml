# Sstyle suite — ft_printf
# Tests written by SStyles93 for the CodeTester (https://github.com/SStyles93/42_CodeTester),
# ported to DeepThought with the author's permission.

[suite]
id = "sstyle-ft_printf"
name = "Sstyle suite — ft_printf"
version = "2.0.0"
project = "ft_printf"
engine = ">=0.2"
authors = ["SStyles93 (tests)", "DeepThought (port)"]
description = "SStyles93's ft_printf tests: every case compared with the system's printf (bytes and return value), behaviour (buffering, write errors, malloc failures), subject requirements, bonus flags, and the original printf's undefined behaviours (informational)."
homepage = "https://github.com/SStyles93/42_CodeTester"

[detect]
any_files = ["ft_printf.h", "*/ft_printf.h"]
makefile_name = "libftprintf.a"

[build]
command = "make -C {project}"
artifacts = ["libftprintf.a"]
checks = ["norminette"]      # Makefile, relink and nm checks are tests (printf_project)

[defaults]
timeout = 10.0
sequential = true            # printf_project runs make inside the project
cflags = ['-DPRINTF_PATH="{project}"']

[[group]]
name = "Mandatory"
description = "cspdiuxX% without flags, behaviour, and the subject's requirements."
category = "mandatory"
runner = "c-unit"
split = true
sources = ["tests/mandatory/*.c"]
include = ["{project}", "tests"]
link = ["{project}/libftprintf.a"]

[[group]]
name = "Bonus"
description = "Flags - 0 . # + and space, minimum width, combinations, the bonus rule."
category = "bonus"
runner = "c-unit"
split = true
when = { make_rule = "bonus" }
before = ["make -C {project} bonus"]
sources = ["tests/bonus/*.c"]
include = ["{project}", "tests"]
link = ["{project}/libftprintf.a"]

[[group]]
name = "Original printf behaviour"
description = "Informational (not graded): what the original printf does where the C standard leaves the behaviour undefined."
category = "extra"
runner = "c-unit"
split = true
sources = ["tests/original/*.c"]
include = ["{project}", "tests"]
link = ["{project}/libftprintf.a"]
