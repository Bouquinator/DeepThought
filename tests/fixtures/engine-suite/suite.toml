# Engine test fixture (NOT a shipped suite): a few libft tests used by
# tests/test_e2e.py to check that DeepThought classifies failures correctly
# (fail, crash, timeout, leak, build error) on tests/fixtures/libft_broken.

[suite]
id = "engine-libft"
name = "Engine fixture — libft subset"
version = "1.0.0"
project = "engine-libft"
engine = ">=0.1"

[build]
command = "make -C {project}"
artifacts = ["libft.a"]
checks = ["files", "rules", "relink", "forbidden"]

[files]
required = ["Makefile", "**/libft.h"]

[forbidden]
allowed = ["malloc", "free", "write"]

[defaults]
timeout = 3.0

[[group]]
name = "Part 1"
category = "mandatory"
runner = "c-unit"
split = true
sources = ["tests/part1/*.c"]
include = ["{project}", "tests"]
link = ["{project}/libft.a"]

[[group]]
name = "Part 2"
category = "mandatory"
runner = "c-unit"
split = true
sources = ["tests/part2/*.c"]
include = ["{project}", "tests"]
link = ["{project}/libft.a"]

[[group]]
name = "Bonus"
category = "bonus"
runner = "c-unit"
split = true
when = { make_rule = "bonus" }
before = ["make -C {project} bonus"]
sources = ["tests/bonus/*.c"]
include = ["{project}", "tests"]
link = ["{project}/libft.a"]
